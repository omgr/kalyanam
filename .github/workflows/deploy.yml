# Builds the static export and publishes it to GitHub Pages on every push to
# main. Replaces the previous manual "build locally, copy out/ into the other
# repo" step, which is why the deployed site drifted out of sight of its source.
#
# One-time setup in the repo: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
#
# The cost of this setting is that pushes landing seconds apart queue behind
# each other, and GitHub has been seen to orphan a run in that state - stuck
# "queued" with no jobs, refusing both cancel and force-cancel. It blocks
# nothing (a later run deploys fine and supersedes it), but it is untidy and
# cannot be cleared through the API. Avoid it by letting one deploy finish
# before pushing again, rather than by cancelling live deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung job should fail and free the queue rather than sit there.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --ci

      - name: Build static export
        run: npm run build:pages
        env:
          STATIC_EXPORT: "true"
          GITHUB_PAGES_REPO: kalyanam

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
